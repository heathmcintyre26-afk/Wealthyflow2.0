name: Static Site Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate required deployment files
        run: |
          test -f index.html || (echo "Missing index.html" && exit 1)
          test -f vercel.json || (echo "Missing vercel.json" && exit 1)
